<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="Rock-Paper-Scissor.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Coda:wght@400;800&display=swap" rel="stylesheet">
        <title>
            rock paper scissor.io
        </title>
    </head>
    <body>
        <div class="Container">
            <header>✨Rock Paper Scissor</header>
            <div class="button-container">
                <button onclick="
                    pickComputerMove();
                    Game('Rock');
                    " class="Rock-button">
                ✊
                </button>
                <button onclick="
                        pickComputerMove();
                        Game('Paper');
                    " class="Paper-button">
                    ✋
                </button>
                <button onclick="
                        pickComputerMove();
                        Game('Scissor');
                    " class="Scissor-button">
                    ✌️
                </button>
            </div>
            <div class="result">
                <p class="scores">
                    YOUR SCORE
                </p>
            </div>
        </div>
        <div class="gameContainer">
            <div class="userMove">
                <p style="font-size: 24px; color: aliceblue; margin-right: 20px;">You</p>
                <p class="user-move">
                    
                </p>
            </div>
            <p style="color: aliceblue;">VS</p>
            <div class="computerMove">
                <p class="computer-move">
                </p>
                <p style="font-size: 24px; color: aliceblue; margin-left: 20px;">Computer</p>
            </div>
        </div>
        <div class="finalResult">
            <p class="final-Result">
                your result is
            </p>
        </div>

        <div class="resetButton-container">
            <button onclick="
                    resetScore();
                " class="resetButton">
                Reset Score
            </button>
        </div>
        
        <script src="Rock-paper-Scissor.js"></script>
    </body>
</html>
