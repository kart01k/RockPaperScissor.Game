<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="Rock-Paper-Scissor.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Coda:wght@400;800&display=swap" rel="stylesheet">
        <title>
            rock paper scissor.io
        </title>
    </head>
    <body>
        <div class="Container">
            <header>✨Rock Paper Scissor</header>
            <div class="button-container">
                <button onclick="
                    pickComputerMove();
                    Game('Rock');
                    " class="Rock-button">
                ✊
                </button>
                <button onclick="
                        pickComputerMove();
                        Game('Paper');
                    " class="Paper-button">
                    ✋
                </button>
                <button onclick="
                        pickComputerMove();
                        Game('Scissor');
                    " class="Scissor-button">
                    ✌️
                </button>
            </div>
            <div class="result">
                <p class="scores">
                    YOUR SCORE
                </p>
            </div>
        </div>
        <div class="gameContainer">
            <div class="userMove">
                <p style="font-size: 24px; color: aliceblue; margin-right: 20px;">You</p>
                <p class="user-move">
                    
                </p>
            </div>
            <p style="color: aliceblue;">VS</p>
            <div class="computerMove">
                <p class="computer-move">
                </p>
                <p style="font-size: 24px; color: aliceblue; margin-left: 20px;">Computer</p>
            </div>
        </div>
        <div class="finalResult">
            <p class="final-Result">
                your result is
            </p>
        </div>

        <div class="resetButton-container">
            <button onclick="
                    resetScore();
                " class="resetButton">
                Reset Score
            </button>
        </div>
        
        <script>

            const score = JSON.parse(localStorage.getItem('score'));
            
            let computerMove = '';
            let Result = '';
            function resetScore (){
                score.Wins = 0;
                score.Losses = 0;
                score.Ties = 0;
                localStorage.setItem('score', JSON.stringify(score));

                document.querySelector('.scores').innerHTML = `Wins: ${score.Wins}...Losses: ${score.Losses}...Ties: ${score.Ties}`;
                document.querySelector('.user-move').innerHTML = '👾';
                document.querySelector('.computer-move').innerHTML = '👾';
                alert('Score has been reset');
            }
            function Game (userMove) {

                if(userMove === 'Rock'){

                    if(computerMove === 'Rock'){
                        Result = 'Tie';
                    }else if(computerMove === 'Paper'){
                        Result = 'You Loose';
                    }else if(computerMove === 'Scissor'){
                        Result = 'You Win';
                    }

                }else if(userMove === 'Paper'){

                    if(computerMove === 'Rock'){
                        Result = 'You Win';
                    }else if(computerMove === 'Paper'){
                        Result = 'Tie';                       
                    }else if(computerMove === 'Scissor'){
                        Result = 'You Loose';
                    }

                }else if(userMove === 'Scissor'){

                    if(computerMove === 'Rock'){
                        Result = 'You Loose';                    
                    }else if(computerMove === 'Paper'){
                        Result = 'You Win';                        
                    }else if(computerMove === 'Scissor'){
                        Result = 'Tie';
                    }

                }

                if (userMove === 'Rock'){
                    document.querySelector('.user-move').innerHTML = '✊';
                }else if(userMove === 'Paper'){
                    document.querySelector('.user-move').innerHTML = '✋';
                }else if(userMove === 'Scissor'){
                    document.querySelector('.user-move').innerHTML = '✌️';
                }

                if(Result === 'You Win'){
                    score.Wins += 1;
                }else if(Result === 'You Loose'){
                    score.Losses += 1;
                }else if(Result === 'Tie'){
                    score.Ties += 1;
                }
                
                document.querySelector('.final-Result').innerHTML = `${Result}`;

                localStorage.setItem('score', JSON.stringify(score));
            
                document.querySelector('.scores')
                    .innerHTML = `Wins: ${score.Wins}...Losses: ${score.Losses}...Ties: ${score.Ties}`
                
                // alert(`You Picked ${userMove}. Computer Picked ${computerMove}. ${Result}
                //     Wins: ${score.Wins}
                //     Losses: ${score.Losses}
                //     Ties: ${score.Ties}
                // `)
            }

            function pickComputerMove () {

                const randomNumber = Math.random();
                if (randomNumber > 0 && randomNumber < 1/3){
                    computerMove = 'Rock';
                    
                }else if(randomNumber >= 1/3 && randomNumber < 2/3){
                    computerMove = 'Paper';
                   
                }else if(randomNumber >= 2/3 && randomNumber < 1){
                    computerMove = 'Scissor';   
                }

                if (computerMove === 'Rock'){
                    document.querySelector('.computer-move').innerHTML = '✊';
                }else if(computerMove === 'Paper'){
                    document.querySelector('.computer-move').innerHTML = '✋';
                }else if(computerMove === 'Scissor'){
                    document.querySelector('.computer-move').innerHTML = '✌️';
                }
            }

        </script>
    </body>
</html>
